spring.application.name=url-shortener

server.port=8080

# =========================
# MySQL Config
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:urlshortener}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA Config
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================
# Redis Config
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Cache TTL - 24 hours
spring.cache.redis.time-to-live=86400000